<div class="container">
    <div class="left">
        <div id="youtube-player"></div>
    </div>
    {{yt.getCurrentTime()}}
    <div class="right lyrics" #lyricContainer>
        <div *ngFor="let line of lyrics; let i = index" [class.active]="i === currentIndex">
            {{ line.text }}
        </div>
    </div>
</div>
